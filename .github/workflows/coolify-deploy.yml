name: Redeploy Coolify after ARM64 image build

on:
  workflow_run:
    workflows: ["Docker ARM64"]
    types: [completed]
    branches: [feat/arm64-docker]

permissions:
  actions: read

jobs:
  request-coolify-deployment:
    if: ${{ github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'learts13/OpenMausBot' && github.event.workflow_run.name == 'Docker ARM64' && github.event.workflow_run.head_branch == 'feat/arm64-docker' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm a tested image was published
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "build-test-publish") | .conclusion] | first // "missing"')
          if [[ "$conclusion" != "success" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Coolify: no successful image build ran (build job: $conclusion)."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Send deployment request to OpenMausBot
        if: steps.build.outputs.deploy == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.OPENMAUSBOT_COOLIFY_DEPLOY_WEBHOOK }}
          REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "Missing repository secret OPENMAUSBOT_COOLIFY_DEPLOY_WEBHOOK" >&2
            exit 1
          fi

          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg branch "$BRANCH" \
            --arg conclusion "$CONCLUSION" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --arg commit_sha "$COMMIT_SHA" \
            '{repository:$repository,workflow:$workflow,branch:$branch,conclusion:$conclusion,run_id:$run_id,run_attempt:$run_attempt,run_url:$run_url,commit_sha:$commit_sha}')

          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'X-Event-Type: github_actions' \
            -H "Idempotency-Key: ${RUN_ID}-${RUN_ATTEMPT}" \
            --data-binary "$payload" \
            "$WEBHOOK_URL"
